pre-commit:
  parallel: false
  jobs:
    - name: format
      run: bun oxfmt {staged_files}
      glob:
        - '*.{js,mjs,cjs,ts,tsx,jsx,json,css,scss,md,yml,yaml,html}'
      stage_fixed: true

    - name: lint
      run: bun oxlint {staged_files} --fix
      glob:
        - '*.{js,mjs,cjs,ts,tsx,jsx}'
      stage_fixed: true
